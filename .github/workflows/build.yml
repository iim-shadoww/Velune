name: Build & Release Velune APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle wrapper properties exist
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Universal Release APK
        run: |
          # 1. Generate release keystore
          keytool -genkeypair -v -keystore release.jks -alias releaseKey -keyalg RSA -keysize 2048 -validity 10000 -storepass velunepass -keypass velunepass -dname "CN=Velune, OU=App, O=Velune, C=US"

          # 2. Locate the generated universal release APK
          APK_PATH=$(find app/build/outputs/apk -name "*universal*release*.apk" | head -n 1)
          echo "Found universal APK at: $APK_PATH"

          # 3. Locate apksigner and sign the universal APK
          BUILD_TOOLS_VERSION=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"

          mkdir -p release-out
          "$APKSIGNER" sign --ks release.jks --ks-pass pass:velunepass --key-pass pass:velunepass --out release-out/Velune-universal-release.apk "$APK_PATH"

      - name: Upload Universal Run Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Universal-Release-APK
          path: release-out/Velune-universal-release.apk
          retention-days: 7

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Velune v1.0.${{ github.run_number }}"
          body: "Automated production universal release build from commit ${{ github.sha }}"
          draft: false
          prerelease: false
          files: release-out/Velune-universal-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
