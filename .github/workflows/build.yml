name: Build Velune APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore missing Gradle wrapper properties
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Create resources.properties in res directories
        run: |
          mkdir -p app/src/main/res
          mkdir -p app/src/main/resources
          mkdir -p app/src/main
          echo "unqualifiedResLocale=en" > app/src/main/res/resources.properties
          echo "unqualifiedResLocale=en" > app/src/main/resources/resources.properties
          echo "unqualifiedResLocale=en" > app/src/main/resources.properties
          echo "unqualifiedResLocale=en" > app/resources.properties
          echo "unqualifiedResLocale=en" > resources.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -x :app:extractArm64DebugSupportedLocales -x :app:extractUniversalDebugSupportedLocales --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Velune-Debug-APK
          path: app/build/outputs/apk/**/*.apk
          retention-days: 7
